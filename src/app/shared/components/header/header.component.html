<header class="flex min-h-16 items-center justify-between gap-3 border-b border-border bg-white px-4 sm:px-6">
  <div class="flex min-w-0 items-center gap-3">
    <button type="button" class="flex h-9 w-9 shrink-0 cursor-pointer items-center justify-center rounded border border-border bg-white text-text hover:bg-surface-50 md:hidden" aria-label="Abrir menú" (click)="menuToggle.emit()">
      <span class="pi pi-bars"></span>
    </button>
    <div class="min-w-0">
    <h1 class="m-0 truncate text-base font-bold text-surface-900 sm:text-lg">Control de Medicamentos</h1>
    <p class="mb-0 mt-0.5 text-xs text-slate-500">SISMED / SIGA</p>
    </div>
  </div>
  <div class="flex shrink-0 items-center gap-2.5 text-surface-700">
    <span class="pi pi-user"></span>
    <span class="hidden lg:inline">{{ user?.username }}</span>
    <button
      type="button"
      class="flex cursor-pointer items-center gap-1.5 rounded border border-border bg-white px-2.5 py-2 text-text hover:bg-surface-50"
      (click)="logout()"
      aria-label="Cerrar sesión"
    >
      <span class="pi pi-sign-out"></span>
      <span class="hidden sm:inline">Salir</span>
    </button>
  </div>
</header>
